<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Rumble 図鑑 / Encyclopedia</title>
  <!-- 読むだけの公式の図鑑。データは encyclopedia/data.js と encyclopedia/i18n.<言語>.js(tools/wiki/build.mjs が公開中の版から作る)。
       このページにゲームのデータのファイルそのものは置かない。作り方と決まりは tools/wiki/build.mjs の頭。 -->
  <style>
    :root { --bg: #0f0518; --panel: #1b0c2a; --panel2: #24113a; --line: #3a2157; --accent: #a55cf0; --text: #e8dff2; --muted: #a992c4; --gold: #ffcc55; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); background-image: radial-gradient(circle at top, #220d3a 0%, #0d0418 70%); background-attachment: fixed; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans TC", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.6; }
    button, input, select { font: inherit; color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    header { padding: 20px 0 12px; border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
    h1 span { color: var(--accent); margin-left: 6px; }
    #ver { margin: 0; color: var(--muted); font-size: 12px; flex: 1 1 200px; }
    #langs { display: flex; gap: 6px; flex-wrap: wrap; }
    #langs button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; }
    #langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    nav { position: sticky; top: 0; z-index: 5; background: rgba(15, 5, 24, .96); border-bottom: 1px solid var(--line); }
    nav .wrap { display: flex; gap: 4px; overflow-x: auto; }
    nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 9px; cursor: pointer; white-space: nowrap; color: var(--muted); }
    nav button[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); font-weight: 600; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 6px; align-items: center; }
    #controls input, #controls select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
    #controls input { flex: 1 1 180px; min-width: 0; }
    #count { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .card:hover, .row:hover { border-color: var(--accent); }
    .card img, .th { width: 64px; height: 64px; object-fit: contain; }
    .card .nm { font-size: 12.5px; line-height: 1.3; word-break: break-word; }
    .tag { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; text-align: left; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; width: 100%; }
    .row .nm { font-weight: 600; flex: 1 1 150px; min-width: 0; }
    .row .sub { color: var(--muted); font-size: 12px; }
    .row.static { cursor: default; }
    .row.static:hover { border-color: var(--line); }
    .sys { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: center; width: 100%; }
    .sys:hover { border-color: var(--accent); }
    .sys .pics { display: flex; }
    .sys .pics img { width: 44px; height: 44px; object-fit: contain; }
    .sysgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
    .fus { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .fus .mon { display: inline-flex; align-items: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px 2px 2px; cursor: pointer; font-size: 13px; }
    .fus .mon img { width: 36px; height: 36px; object-fit: contain; }
    .fus .op { color: var(--muted); }
    #modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    #modal[hidden] { display: none; }
    .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 0 0; width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; padding: 14px 16px 28px; position: relative; }
    @media (min-width: 760px) { #modal { align-items: center; } .sheet { border-radius: 14px; } }
    .sheet .x { position: sticky; top: 0; float: right; margin-left: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; z-index: 2; }
    .sheet h2 { margin: 0 0 6px; font-size: 19px; }
    .sheet h3 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
    .head { display: flex; gap: 12px; align-items: center; }
    .head img { width: 88px; height: 88px; object-fit: contain; flex: none; }
    .head .tags { justify-content: flex-start; }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: right; font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-weight: 600; }
    th:first-child, td:first-child { text-align: left; }
    .scroll { overflow-x: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; }
    .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sk { display: flex; flex-direction: column; gap: 4px; }
    .sk button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: baseline; }
    .sk .lv { color: var(--gold); font-size: 12px; min-width: 44px; font-variant-numeric: tabular-nums; }
    .sk .d { color: var(--muted); font-size: 12px; display: block; }
    .desc { margin: 6px 0; }
    .tier { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; background: rgba(0, 0, 0, .15); }
    .tier .head img { width: 64px; height: 64px; }
    .note { color: var(--muted); font-size: 12.5px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px; }
    .links button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
    section.block { margin: 18px 0; }
    section.block h2 { font-size: 16px; margin: 0 0 8px; }
    footer { margin: 32px 0 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
    footer p { margin: 4px 0; }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  </style>
</head>

      var done = function () { lang = l; U = UI[l]; L = window.PR_WIKI_I18N[l]; document.documentElement.lang = HTMLLANG[l]; try { localStorage.setItem('pr_wiki_lang', l); } catch (e) {} cb && cb(); };
      if (window.PR_WIKI_I18N && window.PR_WIKI_I18N[l]) return done();
      var s = document.createElement('script'); s.src = 'encyclopedia/i18n.' + l + '.js'; s.onload = done;
      s.onerror = function () { $('list').textContent = 'Language data could not be loaded.'; };
      document.head.appendChild(s);
    }
    function pickLang() {
      try { var s = localStorage.getItem('pr_wiki_lang'); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
      var n = (navigator.language || 'en').toLowerCase();
      return n.indexOf('ja') === 0 ? 'ja' : n.indexOf('ko') === 0 ? 'ko' : n.indexOf('zh') === 0 ? 'zh' : 'en';
    }

    // ---- 枠(見出し・タブ・絞り込み) ----
    function chrome() {
      $('ttl').textContent = U.ttl;
      document.title = 'Pocket Rumble ' + U.ttl;
      $('ver').textContent = fmt(U.ver, { v: D.meta.version, d: D.meta.date });
      $('langs').innerHTML = LANGS.map(function (l) { return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === lang) + '">' + esc(UI[l].name) + '</button>'; }).join('');
      $('tabs').innerHTML = TABS.map(function (t) { return '<button type="button" role="tab" data-tab="' + t + '" aria-selected="' + (t === tab) + '">' + esc(U[t]) + '</button>'; }).join('');
      $('mclose').textContent = U.close;
      $('foot').innerHTML = '<p>' + esc(U.gacha) + '</p><p>' + esc(U.note) + ' ' + esc(fmt(U.ver, { v: D.meta.version, d: D.meta.date })) + '</p>';
      controls();
    }
    function sel(id, label, opts, val) {
      return '<select id="' + id + '" aria-label="' + esc(label) + '"><option value="">' + esc(label + ': ' + U.all) + '</option>' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    }
    function controls() {
      var h = '';
      if (tab !== 'gear') h += '<input id="q" type="search" placeholder="' + esc(U.search) + '" value="' + esc(F.q) + '" autocomplete="off">';
      var els = D.elements.map(function (e) { return [e, eName(e)]; });
      if (tab === 'monsters') {
        var used = {}; D.monsters.forEach(function (m) { used[m.r] = 1; });
        h += sel('f-rarity', U.rarity, D.rarities.filter(function (r) { return used[r.k]; }).map(function (r) { return [r.k, rName(r.k)]; }), F.rarity);
        h += sel('f-element', U.element, els.concat([['none', U.noel]]), F.element);
        var seasons = {}; D.monsters.forEach(function (m) { if (m.se) seasons[m.se] = 1; });
        h += sel('f-kind', U.kind, [['wild', U.kWild], ['fo', U.kFo], ['castle', U.kCastle], ['boss', U.kBoss]].concat(Object.keys(seasons).map(function (n) { return ['s' + n, fmt(U.kSeason, { n: n })]; })), F.kind);
      } else if (tab === 'skills') {
        h += sel('f-element', U.element, els.concat([['none', U.noel]]), F.element);
        h += sel('f-scaling', U.scaling, Object.keys(SCALE).map(function (k) { return [k, SCALE[k]]; }), F.scaling);
      } else if (tab === 'classes') {
        h += sel('f-kind', U.kind, [['melee', U.melee], ['ranged', U.ranged], ['c3', U.c3]], F.kind);
      }
      $('controls').innerHTML = h;
    }
    function qmatch(s) { return !F.q || String(s).toLowerCase().indexOf(F.q.toLowerCase()) >= 0; }

    // ---- 一覧 ----
    function render() {
      var h = '', n = null;
      if (tab === 'monsters') {
        var ms = D.monsters.filter(function (m) {
          if (!qmatch(mName(m.k))) return false;
          if (F.rarity && m.r !== F.rarity) return false;
          if (F.element && (F.element === 'none' ? !!m.e : m.e !== F.element)) return false;
          if (F.kind === 'wild' && m.w == null) return false;
          if (F.kind === 'fo' && !m.fo) return false;
          if (F.kind === 'castle' && !m.co) return false;
          if (F.kind === 'boss' && !m.eb) return false;
          if (F.kind.charAt(0) === 's' && String(m.se) !== F.kind.slice(1)) return false;
          return true;
        });
        n = ms.length;
        h = '<div class="grid">' + ms.map(function (m) { return '<button type="button" class="card" data-open="m:' + m.k + '">' + img(m.t) + '<span class="nm">' + esc(mName(m.k)) + '</span><span class="tags">' + rTag(m.r) + eTag(m.e) + '</span></button>'; }).join('') + '</div>';
      } else if (tab === 'classes') {
        var ss = SYS.filter(function (s) {
          if (!s.tiers.some(function (c) { return qmatch(cName(c.k)); })) return false;
          if (F.kind === 'c3' && !s.tiers[0].c3) return false;
          if ((F.kind === 'melee' || F.kind === 'ranged') && s.tiers[0].rt !== F.kind) return false;
          return true;
        });
        n = ss.length;
        h = '<div class="sysgrid">' + ss.map(function (s) {
          return '<button type="button" class="sys" data-open="c:' + s.sys + '"><span class="pics">' + s.tiers.map(function (c) { return img(c.t); }).join('') + '</span><span><span class="nm">' + s.tiers.map(function (c) { return esc(cName(c.k)); }).join(' → ') + '</span><br><span class="tags" style="justify-content:flex-start">' + tag(U[s.tiers[0].rt]) + (s.tiers[0].c3 ? tag(U.c3) : '') + '</span></span></button>';
        }).join('') + '</div>';
      } else if (tab === 'skills') {
        var sk = D.skills.filter(function (s) {
          if (!qmatch(sName(s.k)) && !qmatch(sDesc(s.k))) return false;
          if (F.element && (F.element === 'none' ? !!s.el : s.el !== F.element)) return false;
          if (F.scaling && s.sc !== F.scaling) return false;
          return true;
        }).sort(function (a, b) { return sName(a.k).localeCompare(sName(b.k), HTMLLANG[lang]); });
        n = sk.length;
        h = '<div class="rows">' + sk.map(function (s) { return '<button type="button" class="row" data-open="s:' + s.k + '"><span class="nm">' + esc(sName(s.k)) + '</span>' + eTag(s.el) + '<span class="sub">' + U.mp + ' ' + num(s.mp) + ' ・ ' + esc(U.power) + ' ' + num(s.pw) + ' ・ ' + esc(SCALE[s.sc] || s.sc) + '</span></button>'; }).join('') + '</div>';
      } else if (tab === 'fusion') {
        var fs = D.fusion.filter(function (f) { return qmatch(mName(f.a)) || qmatch(mName(f.b)) || qmatch(mName(f.r)); });
        n = fs.length;
        h = '<div class="rows">' + fs.map(function (f) { return '<div class="row static">' + fusRow(f) + '</div>'; }).join('') + '</div>';
      } else {
        h = gearHtml();
      }
      $('count').textContent = n == null ? '' : fmt(U.count, { n: n });
      $('list').innerHTML = (n === 0) ? '<p class="empty">' + esc(U.empty) + '</p>' : h;
    }
    function monBtn(k) { var m = MON[k]; return '<button type="button" class="mon" data-open="m:' + k + '">' + img(m && m.t) + esc(mName(k)) + '</button>'; }
    function fusRow(f) { return '<span class="fus">' + monBtn(f.a) + '<span class="op">+</span>' + monBtn(f.b) + '<span class="op">→</span>' + monBtn(f.r) + (f.aw ? tag(fmt(U.aw, { n: f.aw })) : '') + '</span>'; }
    function statTable(heads, rows) {
      return '<div class="scroll"><table><thead><tr><th></th>' + heads.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (r) { return '<tr><td>' + r[0] + '</td>' + r[1].map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    function skillList(sk) {
      return '<div class="sk">' + sk.map(function (x) { return '<button type="button" data-open="s:' + x[1] + '"><span class="lv">LV ' + x[0] + '</span><span>' + esc(sName(x[1])) + '<span class="d">' + esc(sDesc(x[1])) + '</span></span></button>'; }).join('') + '</div>';
    }
    function gearHtml() {
      var h = '<section class="block"><h2>' + esc(U.rarH) + '</h2>' + statTable([U.mul, U.opts], D.rarities.map(function (r) { return ['<span style="color:' + r.color + '">' + esc(rName(r.k)) + '</span>', ['×' + num(r.mul), r.opts]]; })) + '</section>';
      if (D.optKinds.length) h += '<section class="block"><h2>' + esc(U.optH) + '</h2><div class="tags" style="justify-content:flex-start">' + D.optKinds.map(function (o) { return tag((L && L.o[o.k]) || o.k); }).join('') + '</div></section>';
      h += '<section class="block"><h2>' + esc(U.relH) + '</h2><div class="rows">' + D.elements.map(function (a) {
        var r = D.elemRel[a] || {};
        return '<div class="row static">' + eTag(a) + '<span class="sub">→</span>' + Object.keys(r).map(function (b) { return eTag(b) + '<span class="sub">×' + num(r[b]) + '</span>'; }).join('') + '</div>';
      }).join('') + '</div></section>';
      return h;
    }

    // ---- くわしい表示 ----
    var vSel = null;
    function detail(kind, key) {
      var h = '';
      if (kind === 'm') {
        var m = MON[key]; if (!m) return false;
        var v = null; if (vSel && m.v) m.v.forEach(function (x) { if (x.e === vSel) v = x; });
        var cur = v || m;
        h += '<div class="head">' + img(m.t, '', v && v.f) + '<div><h2>' + esc(mName(key)) + '</h2><div class="tags">' + rTag(m.r) + eTag(v ? v.e : m.e) + monFlags(m) + '</div></div></div>';
        if (m.w != null) h += '<p class="note">' + esc(U.world) + ': ' + m.w + '</p>';
        if (m.gm && L.g[key]) h += '<h3>' + esc(U.gimmick) + '</h3><p class="desc">' + esc(L.g[key]) + '</p>';
        if (m.v && m.v.length) h += '<h3>' + esc(U.variants) + '</h3><div class="chips"><button type="button" data-v="" aria-pressed="' + (!v) + '">' + esc(U.base) + '（' + esc(eName(m.e)) + '）</button>' + m.v.map(function (x) { return '<button type="button" data-v="' + x.e + '" aria-pressed="' + (v === x) + '">' + esc(eName(x.e)) + '</button>'; }).join('') + '</div>';
        h += '<h3>' + esc(U.stats) + '</h3>' + statTable(ST5, [[esc(U.baseSt), cur.st.map(num)]]);
        h += '<h3>' + esc(U.sk) + '</h3>' + skillList(cur.sk);
        if (madeBy[key]) h += '<h3>' + esc(U.madeBy) + '</h3><div class="rows">' + madeBy[key].map(function (f) { return '<div class="row static">' + fusRow(f) + '</div>'; }).join('') + '</div>';
        if (usedIn[key]) h += '<h3>' + esc(U.usedIn) + '</h3><div class="rows">' + usedIn[key].map(function (f) { return '<div class="row static">' + fusRow(f) + '</div>'; }).join('') + '</div>';
      } else if (kind === 'c') {
        var s = sysMap[key] || (CLS[key] && sysMap[CLS[key].sys]); if (!s) return false;
        h += '<h2>' + s.tiers.map(function (c) { return esc(cName(c.k)); }).join(' → ') + '</h2><div class="tags" style="justify-content:flex-start">' + tag(U[s.tiers[0].rt]) + (s.tiers[0].c3 ? tag(U.c3) : '') + '</div>';
        var u = D.c3[s.sys];
        if (u && u.of.length) h += '<p class="desc">' + esc(fmt(U.unlock, u)) + '</p><div class="links">' + u.of.map(function (x) { return '<button type="button" data-open="c:' + x + '">' + esc(cName(x + '_3')) + '</button>'; }).join('') + '</div>';
        h += statTable(ST6, s.tiers.map(function (c) { return [esc(fmt(U.tier, { n: c.tier, z: ['一', '二', '三'][c.tier - 1] || c.tier })) + ' ' + esc(cName(c.k)), c.st.map(num)]; }));
        s.tiers.forEach(function (c) {
          h += '<div class="tier"><div class="head">' + img(c.t) + '<div><h3 style="margin:0">' + esc(fmt(U.tier, { n: c.tier, z: ['一', '二', '三'][c.tier - 1] || c.tier })) + '</h3><strong>' + esc(cName(c.k)) + '</strong></div></div><p class="desc">' + esc(cDesc(c.k)) + '</p>' + skillList(c.sk);
          if (c.pn) h += '<p class="note">' + esc(fmt(U.promo, { l: c.pl, c: num(c.pc), n: cName(c.pn) })) + '</p>';
          h += '</div>';
        });
      } else if (kind === 's') {
        var k = SKL[key]; if (!k) return false;
        h += '<h2>' + esc(sName(key)) + '</h2><div class="tags" style="justify-content:flex-start">' + eTag(k.el) + tag(U.scaling + ': ' + (SCALE[k.sc] || k.sc)) + '</div><p class="desc">' + esc(sDesc(key)) + '</p>';
        h += statTable([U.mp, U.cd, U.range, U.aoe, U.power], [['', [num(k.mp), esc(fmt(U.sec, { s: num(k.cd / 1000) })), num(k.rg), num(k.aoe), '×' + num(k.pw)]]]);
        if (learnC[key]) h += '<h3>' + esc(U.lc) + '</h3><div class="links">' + learnC[key].map(function (x) { return '<button type="button" data-open="c:' + CLS[x[0]].sys + '">' + esc(cName(x[0])) + ' <span class="note">LV ' + x[1] + '</span></button>'; }).join('') + '</div>';
        if (learnM[key]) h += '<h3>' + esc(U.lm) + '</h3><div class="links">' + learnM[key].map(function (x) { return '<button type="button" data-open="m:' + x[0] + (x[2] ? ':' + x[2] : '') + '">' + esc(mName(x[0])) + (x[2] ? '（' + esc(eName(x[2])) + '）' : '') + ' <span class="note">LV ' + x[1] + '</span></button>'; }).join('') + '</div>';
      } else return false;
      $('detail').innerHTML = h;
      return true;
    }
    function show(spec, push) {
      var p = String(spec).split(':'), kind = p[0], key = p[1];
      vSel = (kind === 'm' && p[2]) ? p[2] : null;
      if (!detail(kind, key)) return;
      open = kind + ':' + key;
      $('modal').hidden = false; document.body.style.overflow = 'hidden';
      $('modal').querySelector('.sheet').scrollTop = 0;
      if (push !== false) setHash();
    }
    function hide(push) { if (!open) return; open = null; vSel = null; $('modal').hidden = true; document.body.style.overflow = ''; if (push !== false) setHash(); }

    // ---- アドレスの # に、言語・タブ・開いている項目を入れる(その項目へのリンクを渡せる) ----
    var hashing = false;
    function setHash() { hashing = true; var h = '#' + lang + '/' + tab + (open ? '/' + open + (vSel ? ':' + vSel : '') : ''); try { history.replaceState(null, '', h); } catch (e) { location.hash = h; } hashing = false; }
    function readHash() { var p = decodeURIComponent(location.hash.replace(/^#/, '')).split('/'); return { lang: LANGS.indexOf(p[0]) >= 0 ? p[0] : null, tab: TABS.indexOf(p[1]) >= 0 ? p[1] : null, open: p[2] || null }; }
    function go(l, t, o) { setLang(l, function () { tab = t || tab; chrome(); render(); if (o) show(o, false); else hide(false); setHash(); }); }

    // ---- 操作 ----
    document.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (e.target === $('modal')) return hide();
      if (!b) return;
      if (b.id === 'mclose') return hide();
      if (b.dataset.lang) return go(b.dataset.lang, tab, open ? open + (vSel ? ':' + vSel : '') : null);
      if (b.dataset.tab) { tab = b.dataset.tab; F.q = ''; F.kind = ''; chrome(); render(); setHash(); window.scrollTo(0, 0); return; }
      if (b.dataset.open) return show(b.dataset.open);
      if (b.dataset.v != null && open) { vSel = b.dataset.v || null; var keep = $('modal').querySelector('.sheet').scrollTop; detail('m', open.split(':')[1]); $('modal').querySelector('.sheet').scrollTop = keep; setHash(); }
    });
    document.addEventListener('input', function (e) { if (e.target.id === 'q') { F.q = e.target.value; render(); } });
    document.addEventListener('change', function (e) {
      var id = e.target.id;
      if (id === 'f-rarity') F.rarity = e.target.value; else if (id === 'f-element') F.element = e.target.value; else if (id === 'f-kind') F.kind = e.target.value; else if (id === 'f-scaling') F.scaling = e.target.value; else return;
      render();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
    window.addEventListener('hashchange', function () { if (hashing) return; var h = readHash(); go(h.lang || lang, h.tab || tab, h.open); });

    var h0 = readHash();
    go(h0.lang || pickLang(), h0.tab || 'monsters', h0.open);
  })();
  </script>
</body>
</html>
